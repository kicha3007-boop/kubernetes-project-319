{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $fullname := include "bulletin-board.fullname" . }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq $es.provider "yandexlockbox" }}
    # Yandex Lockbox: доступ по авторизованному ключу SA с ролью lockbox.payloadViewer
    yandexlockbox:
      auth:
        authorizedKeySecretRef:
          name: {{ $es.yandexlockbox.authSecretName }}
          key: {{ $es.yandexlockbox.authSecretKey }}
    {{- else if eq $es.provider "kubernetes" }}
    # Локальная замена Lockbox: Secret в отдельном namespace, читается по RBAC
    kubernetes:
      remoteNamespace: {{ $es.kubernetes.remoteNamespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $fullname }}-eso
    {{- else if eq $es.provider "fake" }}
    fake:
      data:
        - key: {{ $fullname }}
          value: {{ $es.fake.data | toJson | quote }}
    {{- else }}
    {{- fail (printf "externalSecrets.provider=%s не поддерживается" $es.provider) }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $fullname }}
  target:
    name: {{ include "bulletin-board.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  # Все записи источника целиком: ключи записей = имена переменных окружения
  dataFrom:
    - extract:
        {{- if eq $es.provider "yandexlockbox" }}
        key: {{ required "externalSecrets.yandexlockbox.lockboxSecretId обязателен (terraform output lockbox_secret_id)" $es.yandexlockbox.lockboxSecretId }}
        {{- else if eq $es.provider "kubernetes" }}
        key: {{ $es.kubernetes.remoteSecret }}
        {{- else }}
        key: {{ $fullname }}
        {{- end }}
{{- if eq $es.provider "kubernetes" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-eso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
---
# Право читать ровно один Secret-источник в namespace «эмулятора Lockbox»
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-eso-reader
  namespace: {{ $es.kubernetes.remoteNamespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $es.kubernetes.remoteSecret | quote }}]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-eso-reader
  namespace: {{ $es.kubernetes.remoteNamespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-eso-reader
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-eso
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
