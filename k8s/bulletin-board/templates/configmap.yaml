apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bulletin-board.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.service.targetPort | quote }}
  MANAGEMENT_SERVER_PORT: {{ .Values.service.managementPort | quote }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
