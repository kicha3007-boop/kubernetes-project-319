{{- /*
Secret из values — только когда ESO выключен и не указан existingSecret.
В рабочих окружениях Secret создаёт External Secrets Operator (externalsecret.yaml).
*/ -}}
{{- if and .Values.secrets.create (not .Values.externalSecrets.enabled) (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bulletin-board.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
