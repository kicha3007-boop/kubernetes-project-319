{{- if .Values.monitoring.grafanaDashboard.enabled }}
{{- $fullname := include "bulletin-board.fullname" . }}
{{- $ingress := default $fullname .Values.monitoring.prometheusRule.ingressName }}
{{- $json := .Files.Get "files/dashboard.json" | replace "__NAMESPACE__" .Release.Namespace | replace "__SERVICE__" $fullname | replace "__INGRESS__" $ingress }}
# Дашборд подхватывается sidecar-контейнером Grafana по метке grafana_dashboard=1
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bulletin-board.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  bulletin-board.json: |-
    {{- $json | nindent 4 }}
{{- end }}
