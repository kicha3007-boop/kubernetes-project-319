apiVersion: v1
kind: Service
metadata:
  name: {{ include "bulletin-board.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "bulletin-board.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    # actuator: health-пробы и /actuator/prometheus; наружу через ingress не публикуется
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
