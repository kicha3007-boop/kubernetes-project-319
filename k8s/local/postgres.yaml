# PostgreSQL для локального стенда (kind) — замена Managed PostgreSQL.
# Пароль — локальная заглушка, совпадает с k8s/manifests/secret.yaml и источником
# секретов для ESO (make eso-seed). В облаке используется Managed PostgreSQL из terraform/.
apiVersion: v1
kind: Namespace
metadata:
  name: bulletin-db
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: bulletin-db
type: Opaque
stringData:
  POSTGRES_DB: bulletins
  POSTGRES_USER: bulletins
  POSTGRES_PASSWORD: local-dev-only
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bulletin-db
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bulletin-db
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: mirror.gcr.io/library/postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-auth
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bulletins", "-d", "bulletins"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
