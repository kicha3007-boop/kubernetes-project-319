# kube-prometheus-stack для локального стенда — облегчённый: короткий retention,
# маленькие requests, без etcd/scheduler/controller-manager (в kind они недоступны снаружи).
# Grafana: http://grafana.localhost:18080 (admin / пароль из Secret, см. make grafana-password)
# Prometheus: http://prometheus.localhost:18080
fullnameOverride: kps

defaultRules:
  create: true
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.localhost
    paths:
      - /
  prometheusSpec:
    retention: 12h
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Собирать ServiceMonitor/PrometheusRule из всех namespace без метки release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - alertmanager.localhost
    paths:
      - /
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

grafana:
  # Пароль admin генерирует чарт и кладёт в Secret kps-grafana
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.localhost
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
