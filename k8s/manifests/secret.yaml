# Секрет ТОЛЬКО для локального kind: значения — заглушки, совпадают с k8s/local/postgres.yaml.
# В облаке этот Secret не применяется: его создаёт External Secrets Operator из Lockbox
# (Helm-чарт, values-yc.yaml -> externalSecrets.enabled=true).
apiVersion: v1
kind: Secret
metadata:
  name: bulletin-board-secrets
  namespace: bulletin-board
  labels:
    app.kubernetes.io/name: bulletin-board
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "bulletins"
  SPRING_DATASOURCE_PASSWORD: "local-dev-only"
  STORAGE_S3_ACCESSKEY: ""
  STORAGE_S3_SECRETKEY: ""
