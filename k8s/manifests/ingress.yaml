# Внешний доступ через ingress-nginx. Локально: http://bulletin-board.localhost:18080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bulletin-board
  namespace: bulletin-board
  labels:
    app.kubernetes.io/name: bulletin-board
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # При ошибке соединения с подом nginx повторит запрос на другом поде
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
spec:
  ingressClassName: nginx
  rules:
    - host: bulletin-board.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bulletin-board
                port:
                  name: http
